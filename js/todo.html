<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="../css/todo.css">
</head>

<body>

    <main>
        <h1>My Todo List</h1>

        <form id="todoForm">
            <input
                id="todoInput"
                type="text"
                placeholder="Enter a task"
            >

            <button type="submit">
                Add Task
            </button>
        </form>

        <ul id="todoList"></ul>
    </main>

    <script src="todo.js"></script>

</body>
</html>
